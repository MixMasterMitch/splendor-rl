[project]
name = "splendor"
version = "0.1.0"
description = "Splendor RL agent with interactive play server"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
splendor-train = "agent.scripts.train:main"
splendor-iterate = "agent.scripts.iterate:main"
splendor-smoke = "agent.scripts.smoke_train:main"
splendor-status = "agent.scripts.status:main"
splendor-eval = "agent.scripts.eval_ckpt:main"
splendor-league = "agent.scripts.league_table:main"
splendor-play = "play.server:main"

[tool.pytest.ini_options]
testpaths = ["agent/tests", "play/tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "play*", "replay*"]
